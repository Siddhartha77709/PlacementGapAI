# Local evaluation profile: In-memory H2 with MySQL syntax mode
# Useful for verifying full-stack flow before external MySQL credentials are configured.
spring.datasource.url=jdbc:h2:mem:placementgap;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Model override for local evaluation (uses GEMINI_MODEL env or falls back to this)
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
